services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafkalab-kafka
    ports:
      - "9092:9092"     # apps on your machine connect to localhost:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller          # KRaft mode: no ZooKeeper
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"        # topics are created on purpose by create_topics.py

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafkalab-ui
    depends_on: [kafka]
    ports:
      - "8080:8080"     # UI: http://localhost:8080
    environment:
      KAFKA_CLUSTERS_0_NAME: lab
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092

  postgres:
    image: postgres:16
    container_name: kafkalab-postgres
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: ledger
    ports:
      - "5434:5432"     # 5434 so it can run next to the RabbitMQ lab
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
